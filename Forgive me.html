<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>I'm Sorry ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: rgba(255,255,255,0.95);
            padding: 40px 30px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            position: relative;
            z-index: 2;
        }

        .heart {
            font-size: 65px;
            animation: heartbeat 1.2s infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        h1 {
            color: #ff4f70;
            margin: 15px 0;
            font-size: 38px;
        }

        p {
            color: #444;
            font-size: 17px;
            line-height: 1.7;
            margin: 15px 0;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            border: none;
            padding: 13px 25px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        #yes {
            background: #ff4f70;
            color: white;
        }

        #yes:hover {
            transform: scale(1.1);
            background: #ff3158;
        }

        #no {
            background: #eee;
            color: #444;
        }

        #message {
            display: none;
            margin-top: 25px;
            font-size: 20px;
            color: #ff4f70;
            font-weight: bold;
        }

        /* Floating hearts */
        .floating-heart {
            position: absolute;
            bottom: -30px;
            font-size: 25px;
            animation: floatUp 6s linear infinite;
            opacity: 0.7;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0);
                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="heart">❤️</div>

        <h1>I'm Sorry...</h1>

        <p>
            Hey... I know I messed up, and I'm genuinely sorry.
            I never wanted to hurt you or make you feel bad.
        </p>

        <p>
            You are really important to me, and I don't want
            one mistake to ruin our friendship.
        </p>

        <p>
            I hope you can forgive me. 🥺
        </p>

        <div class="buttons">

            <button id="yes" onclick="forgive()">
                Okay, I Forgive You ❤️
            </button>

            <button id="no" onclick="notYet()">
                Not Yet 😤
            </button>

        </div>

        <div id="message">
            YAYYY! 🥹❤️<br>
            Thank you for forgiving me!
        </div>

    </div>

    <script>

        function forgive() {
            document.getElementById("message").style.display = "block";
        }

        function notYet() {
            alert("I'll wait... 🥺 Take your time ❤️");
        }

        // Create floating hearts
        function createHeart() {

            const heart = document.createElement("div");

            heart.classList.add("floating-heart");
            heart.innerHTML = "❤️";

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration =
                (4 + Math.random() * 4) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 8000);
        }

        setInterval(createHeart, 500);

    </script>

</body>
</html>
